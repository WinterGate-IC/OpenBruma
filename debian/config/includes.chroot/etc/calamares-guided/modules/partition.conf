---
# Guided installer defaults: erase the selected disk automatically.
# The user still confirms the disk and sees the summary.
initialPartitioningChoice: eraseDisk
initialSwapChoice: none
defaultFileSystemType: ext4
efiSystemPartition: /boot/efi
userSwapChoices:
  - none
  - small
  - suspend
  - file
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowZfsEncryption: true
