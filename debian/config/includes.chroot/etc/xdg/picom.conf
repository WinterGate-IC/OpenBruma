# OpenBruma picom configuration (neon window glow).
# #2ee6a0 is replaced by openbruma-theme with the selected preset colour.
backend = "xrender";
vsync = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.55;
shadow-offset-x = 0;
shadow-offset-y = 0;
shadow-color = "#2ee6a0";

corner-radius = 6;
rounded-corners-exclude = [
  "class_g = 'Xfce4-panel'",
  "class_g = 'xfdesktop'",
  "class_g = 'mpv'",
  "name = 'xwinwrap'",
];

shadow-exclude = [
  "class_g = 'Xfce4-panel'",
  "class_g = 'xfdesktop'",
  "class_g = 'mpv'",
  "name = 'xwinwrap'",
  "class_g = 'Lightdm-gtk-greeter'",
];

blur-background = false;
detect-client-opacity = true;
refresh-rate = 0;

wintypes:
{
  tooltip = { shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { shadow = false; };
  dropdown_menu = { shadow = false; };
  utility = { shadow = true; };
  normal = { shadow = true; };
};
