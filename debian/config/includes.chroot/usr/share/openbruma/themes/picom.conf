# OpenBruma picom configuration (optional neon window glow).
# @@ACCENT@@ is replaced by openbruma-theme with the selected preset colour.
# Kept deliberately conservative: this is only started on demand with
# `openbruma-glow on` because some virtual machines dislike compositing
# overlays. xfwm's own compositor is used by default.
backend = "xrender";
vsync = false;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.50;
shadow-offset-x = 0;
shadow-offset-y = 0;
shadow-color = "@@ACCENT@@";

shadow-exclude = [
  "class_g = 'Xfce4-panel'",
  "class_g = 'xfdesktop'",
  "class_g = 'mpv'",
  "name = 'xwinwrap'",
  "class_g = 'Lightdm-gtk-greeter'",
];

blur-background = false;

wintypes:
{
  tooltip = { shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { shadow = false; };
  dropdown_menu = { shadow = false; };
};
