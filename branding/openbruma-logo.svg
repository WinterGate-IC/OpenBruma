<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#13233a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0ff"/>
      <stop offset="0.5" stop-color="#4a90d9"/>
      <stop offset="1" stop-color="#1f5f9e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded shield -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#2b4a72" stroke-width="6"/>

  <!-- forge / gate arch -->
  <path d="M150 360 L150 230 A106 106 0 0 1 362 230 L362 360 Z"
        fill="none" stroke="url(#steel)" stroke-width="14" stroke-linejoin="round"/>
  <!-- shadow interior -->
  <path d="M176 352 L176 236 A80 80 0 0 1 336 236 L336 352 Z"
        fill="#060a12" opacity="0.92"/>
  <!-- ember / star -->
  <g filter="url(#glow)">
    <path d="M256 190 L268 228 L306 240 L268 252 L256 290 L244 252 L206 240 L244 228 Z"
          fill="#bfe0ff"/>
  </g>
  <!-- anvil base -->
  <path d="M132 392 L380 392 L360 424 L152 424 Z" fill="url(#steel)"/>
  <rect x="196" y="360" width="120" height="34" rx="8" fill="url(#steel)"/>

  <!-- wordmark -->
  <text x="256" y="474" font-family="DejaVu Sans, Verdana, sans-serif" font-size="34"
        font-weight="bold" text-anchor="middle" fill="#dcecff" letter-spacing="2">OpenBruma</text>
</svg>
