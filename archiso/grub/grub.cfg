# OpenBruma GRUB config
set default="0"
set timeout="5"

menuentry "OpenBruma (x86_64, linux-lts)" {
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts archisobasedir=%INSTALL_DIR% archisolabel=%ISO_LABEL% cow_spacesize=4G
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
}

menuentry "OpenBruma (standard kernel)" {
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ISO_LABEL% cow_spacesize=4G
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}
