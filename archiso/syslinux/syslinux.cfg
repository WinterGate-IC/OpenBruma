# SPINX
DEFAULT openbruma
PROMPT 0
MENU TITLE OpenBruma
TIMEOUT 50

LABEL openbruma
  MENU LABEL OpenBruma (x86_64, linux-lts)
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ISO_LABEL% cow_spacesize=4G zswap.enabled=1 zswap.compressor=zstd zswap.max_pool_percent=20

LABEL openbruma-standard
  MENU LABEL OpenBruma (standard kernel)
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ISO_LABEL% cow_spacesize=4G zswap.enabled=1 zswap.compressor=zstd zswap.max_pool_percent=20
