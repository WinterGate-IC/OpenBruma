---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: welcome
  module: welcome
- id: locale
  module: locale
- id: keyboard
  module: keyboard
- id: partition
  module: partition
- id: users
  module: users
- id: summary
  module: summary
- id: install
  module: install
- id: finished
  module: finished

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - install
  - users
  - displaymanager
  - bootloader
  - packages
  - finished

branding: openbruma

prompt-install: true
dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
>